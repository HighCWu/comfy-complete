name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_base_rebuild:
        description: "Rebuild the full base even when its content-hash tag exists"
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SAGEATTN_VERSION: "2.2.0"

jobs:
  build-sageattn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          # Add swap as safety net during CUDA compilation.
          # Tolerant: newer ubuntu-latest images sometimes ship a pre-active
          # swapfile at /mnt/swapfile → ETXTBSY. Skip silently if so.
          if ! swapon --show --name=swapfile 2>/dev/null | grep -q swapfile; then
            sudo fallocate -l 16G /mnt/swapfile 2>/dev/null || true
            sudo chmod 600 /mnt/swapfile 2>/dev/null || true
            sudo mkswap /mnt/swapfile 2>/dev/null || true
            sudo swapon /mnt/swapfile 2>/dev/null || true
          fi
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker
          echo "=== Memory ==="
          free -h

      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete-sageattn" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if sageattn image already exists
        id: check
        run: |
          if docker manifest inspect ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} >/dev/null 2>&1; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "Image ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} already exists — skipping build"
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "Image not found — will build"
          fi

      - name: Build and push sageattn wheels
        if: steps.check.outputs.skipped != 'true'
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/sageattn.Dockerfile \
            --build-arg SAGEATTN_VERSION=${{ env.SAGEATTN_VERSION }} \
            -t ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} \
            -t ${{ steps.img.outputs.name }}:latest \
            .
          docker push ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }}
          docker push ${{ steps.img.outputs.name }}:latest

  build-base:
    needs: build-sageattn
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      base_tag: ${{ steps.base.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker

      - uses: actions/checkout@v4

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - name: Calculate base content hash
        id: base
        run: |
          HASH=$({
            printf 'SAGEATTN_VERSION=%s\n' "${{ env.SAGEATTN_VERSION }}"
            sha256sum \
              docker/Dockerfile.cloudbuild \
              docker/entrypoint.sh \
              requirements.txt \
              scripts/install_custom_nodes.py \
              supported_nodes.yaml \
              version_lock.yaml
          } | sha256sum | cut -d' ' -f1)
          echo "tag=base-${HASH:0:16}" >> "$GITHUB_OUTPUT"
          echo "Base content tag: base-${HASH:0:16}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for reusable base image
        id: existing
        run: |
          IMAGE="${{ steps.img.outputs.base }}:${{ steps.base.outputs.tag }}"
          FORCE="${{ inputs.force_base_rebuild || false }}"
          if [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing ${IMAGE}"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Building ${IMAGE}"
          fi

      - name: Build and push base image
        if: steps.existing.outputs.reuse != 'true'
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.cloudbuild \
            --build-arg SAGEATTN_VERSION=${{ env.SAGEATTN_VERSION }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from ${{ steps.img.outputs.base }}:latest \
            --target base \
            -t ${{ steps.img.outputs.base }}:latest \
            -t ${{ steps.img.outputs.base }}:${{ steps.base.outputs.tag }} \
            -t ${{ steps.img.outputs.base }}:${{ github.sha }} \
            .
          docker push ${{ steps.img.outputs.base }}:latest
          docker push ${{ steps.img.outputs.base }}:${{ steps.base.outputs.tag }}
          docker push ${{ steps.img.outputs.base }}:${{ github.sha }}

      - name: Tag reusable base for this commit
        if: steps.existing.outputs.reuse == 'true'
        uses: imjasonh/setup-crane@v0.4

      - name: Publish commit tags for reusable base
        if: steps.existing.outputs.reuse == 'true'
        run: |
          SOURCE="${{ steps.img.outputs.base }}:${{ steps.base.outputs.tag }}"
          crane tag "$SOURCE" "${{ github.sha }}"
          crane tag "$SOURCE" latest

  build-runpod:
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker

      - uses: actions/checkout@v4

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runpod image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.runpod \
            --build-arg BASE_IMAGE=${{ steps.img.outputs.base }}:${{ needs.build-base.outputs.base_tag }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from ${{ steps.img.outputs.base }}-runpod:latest \
            -t ${{ steps.img.outputs.base }}-runpod:latest \
            -t ${{ steps.img.outputs.base }}-runpod:${{ github.sha }} \
            .
          docker push ${{ steps.img.outputs.base }}-runpod:latest
          docker push ${{ steps.img.outputs.base }}-runpod:${{ github.sha }}

      - name: Optionally dispatch isolated staging verification
        if: github.ref == 'refs/heads/main' && vars.AUTO_STAGING_ROLLOUT == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.LAIMON_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::AUTO_STAGING_ROLLOUT is true but LAIMON_REPOSITORY_DISPATCH_TOKEN is missing"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/HighCWu/laimon/dispatches \
            -d '{"event_type":"comfy-image-built","client_payload":{"comfy_complete_sha":"${{ github.sha }}"}}'

  # -----------------------------------------------------------------------
  # NOTE: object_info seeding used to live here as a `seed-object-info` job
  # chained off build-base. It has been extracted to a standalone workflow:
  #
  #   .github/workflows/seed-object-info.yml
  #
  # That workflow auto-fires via `workflow_run` when this Docker Build
  # workflow completes successfully on main (so freshly-built images still
  # seed their object_info automatically), and also supports manual
  # `workflow_dispatch` for re-seeding without rebuilding the image
  # (e.g. after a Worker-side bug fix, secret rotation, or API endpoint
  # change). See that file for setup instructions.
  # -----------------------------------------------------------------------
