name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SAGEATTN_VERSION: "2.2.0"

jobs:
  build-sageattn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          # Add swap as safety net during CUDA compilation.
          # Tolerant: newer ubuntu-latest images sometimes ship a pre-active
          # swapfile at /mnt/swapfile → ETXTBSY. Skip silently if so.
          if ! swapon --show --name=swapfile 2>/dev/null | grep -q swapfile; then
            sudo fallocate -l 16G /mnt/swapfile 2>/dev/null || true
            sudo chmod 600 /mnt/swapfile 2>/dev/null || true
            sudo mkswap /mnt/swapfile 2>/dev/null || true
            sudo swapon /mnt/swapfile 2>/dev/null || true
          fi
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker
          echo "=== Memory ==="
          free -h

      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete-sageattn" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if sageattn image already exists
        id: check
        run: |
          if docker manifest inspect ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} >/dev/null 2>&1; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "Image ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} already exists — skipping build"
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "Image not found — will build"
          fi

      - name: Build and push sageattn wheels
        if: steps.check.outputs.skipped != 'true'
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/sageattn.Dockerfile \
            --build-arg SAGEATTN_VERSION=${{ env.SAGEATTN_VERSION }} \
            -t ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} \
            -t ${{ steps.img.outputs.name }}:latest \
            .
          docker push ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }}
          docker push ${{ steps.img.outputs.name }}:latest

  build-base:
    needs: build-sageattn
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker

      - uses: actions/checkout@v4

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.cloudbuild \
            --build-arg SAGEATTN_VERSION=${{ env.SAGEATTN_VERSION }} \
            --target base \
            -t ${{ steps.img.outputs.base }}:latest \
            -t ${{ steps.img.outputs.base }}:${{ github.sha }} \
            .
          docker push ${{ steps.img.outputs.base }}:latest
          docker push ${{ steps.img.outputs.base }}:${{ github.sha }}

  build-runpod:
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker

      - uses: actions/checkout@v4

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runpod image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.runpod \
            --build-arg BASE_IMAGE=${{ steps.img.outputs.base }}:${{ github.sha }} \
            -t ${{ steps.img.outputs.base }}-runpod:latest \
            -t ${{ steps.img.outputs.base }}-runpod:${{ github.sha }} \
            .
          docker push ${{ steps.img.outputs.base }}-runpod:latest
          docker push ${{ steps.img.outputs.base }}-runpod:${{ github.sha }}

  # -----------------------------------------------------------------------
  # seed-object-info: extract /object_info from the freshly built image
  # and push it to the API so the frontend has node definitions on first
  # load (no cold-start RunPod fetch needed).
  #
  # Secret setup (comfy-complete repo → Settings → Secrets and variables → Actions):
  #   ADMIN_SECRET    — must match `wrangler secret put ADMIN_SECRET` on the API
  #   API_BASE_URL    — e.g. https://laimon.ai (no trailing slash)
  #
  # Both secrets are injected as step-level `env:` vars — they NEVER enter
  # the Docker image (no --build-arg, no ENV). GitHub masks them in logs.
  # -----------------------------------------------------------------------
  seed-object-info:
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: docker pull ${{ steps.img.outputs.base }}:${{ github.sha }}

      - name: Start ComfyUI in CPU mode
        run: |
          docker run -d --name comfy-extractor \
            -p 8188:8188 \
            -e COMFY_EXTRA_ARGS="--cpu" \
            ${{ steps.img.outputs.base }}:${{ github.sha }}

      - name: Wait for ComfyUI /object_info
        run: |
          echo "Waiting for ComfyUI to serve /object_info..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8188/object_info -o /tmp/object_info.json 2>/dev/null; then
              SIZE=$(stat -c %s /tmp/object_info.json 2>/dev/null || stat -f %z /tmp/object_info.json)
              NODES=$(python3 -c "import json; print(len(json.load(open('/tmp/object_info.json'))))" 2>/dev/null || echo "?")
              if [ "$NODES" != "?" ] && [ "$NODES" -gt 0 ]; then
                echo "ComfyUI ready — $NODES nodes, ${SIZE} bytes"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "ERROR: ComfyUI did not serve /object_info within timeout"
          docker logs comfy-extractor 2>&1 | tail -100
          exit 1

      - name: Push object_info to API
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$ADMIN_SECRET" ] || [ -z "$API_BASE_URL" ]; then
            echo "WARNING: ADMIN_SECRET or API_BASE_URL not set — skipping seed (set these in repo secrets to enable)"
            exit 0
          fi
          echo "Pushing object_info to ${API_BASE_URL}/api/admin/object-info"
          HTTP_CODE=$(curl -s -o /tmp/seed-response.json -w "%{http_code}" \
            -X POST \
            -H "X-Admin-Secret: ${ADMIN_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/object_info.json \
            "${API_BASE_URL}/api/admin/object-info")
          echo "API response (HTTP ${HTTP_CODE}):"
          cat /tmp/seed-response.json
          echo ""
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: seed failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

      - name: Cleanup container
        if: always()
        run: docker rm -f comfy-extractor || true
