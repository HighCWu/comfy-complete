name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SAGEATTN_VERSION: "2.2.0"

jobs:
  build-sageattn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          # Add swap as safety net during CUDA compilation.
          # Tolerant: newer ubuntu-latest images sometimes ship a pre-active
          # swapfile at /mnt/swapfile → ETXTBSY. Skip silently if so.
          if ! swapon --show --name=swapfile 2>/dev/null | grep -q swapfile; then
            sudo fallocate -l 16G /mnt/swapfile 2>/dev/null || true
            sudo chmod 600 /mnt/swapfile 2>/dev/null || true
            sudo mkswap /mnt/swapfile 2>/dev/null || true
            sudo swapon /mnt/swapfile 2>/dev/null || true
          fi
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker
          echo "=== Memory ==="
          free -h

      - uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete-sageattn" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if sageattn image already exists
        id: check
        run: |
          if docker manifest inspect ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} >/dev/null 2>&1; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "Image ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} already exists — skipping build"
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "Image not found — will build"
          fi

      - name: Build and push sageattn wheels
        if: steps.check.outputs.skipped != 'true'
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/sageattn.Dockerfile \
            --build-arg SAGEATTN_VERSION=${{ env.SAGEATTN_VERSION }} \
            -t ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} \
            -t ${{ steps.img.outputs.name }}:latest \
            .
          docker push ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }}
          docker push ${{ steps.img.outputs.name }}:latest

  build-base:
    needs: build-sageattn
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker

      - uses: actions/checkout@v4

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.cloudbuild \
            --build-arg SAGEATTN_VERSION=${{ env.SAGEATTN_VERSION }} \
            --target base \
            -t ${{ steps.img.outputs.base }}:latest \
            -t ${{ steps.img.outputs.base }}:${{ github.sha }} \
            .
          docker push ${{ steps.img.outputs.base }}:latest
          docker push ${{ steps.img.outputs.base }}:${{ github.sha }}

  build-runpod:
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker

      - uses: actions/checkout@v4

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runpod image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.runpod \
            --build-arg BASE_IMAGE=${{ steps.img.outputs.base }}:${{ github.sha }} \
            -t ${{ steps.img.outputs.base }}-runpod:latest \
            -t ${{ steps.img.outputs.base }}-runpod:${{ github.sha }} \
            .
          docker push ${{ steps.img.outputs.base }}-runpod:latest
          docker push ${{ steps.img.outputs.base }}-runpod:${{ github.sha }}

      # ---------------------------------------------------------------------
      # Auto-deploy: PATCH the RunPod serverless endpoint to point at the
      # freshly-built image. Fires only on main (the same image tag is
      # pushed for branch builds, but we don't want every WIP branch
      # moving production). PATCHes ONLY the image field — env vars set
      # via RunPod dashboard survive (partial update, not full replace).
      #
      # Requires repo secrets:
      #   RUNPOD_API_KEY      — long-lived API key (user-generated)
      #   RUNPOD_ENDPOINT_ID  — e.g. 0wwzielp9onxfh
      #
      # Verification: parses the PATCH response, asserts the returned
      # image matches what we sent. Anything else (key revoked, endpoint
      # deleted, RunPod 5xx) fails the step loudly so a silently-stale
      # endpoint can't ship.
      # ---------------------------------------------------------------------
      - name: Update RunPod endpoint to new image
        if: github.ref == 'refs/heads/main'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RUNPOD_API_KEY}" ] || [ -z "${RUNPOD_ENDPOINT_ID}" ]; then
            echo "SKIP: RUNPOD_API_KEY or RUNPOD_ENDPOINT_ID secret not set"
            exit 0
          fi
          # steps.img.outputs.base already includes the registry + repo
          # (e.g. "ghcr.io/highcwu/comfy-complete") — just append the
          # "-runpod" suffix + SHA tag.
          IMAGE="${{ steps.img.outputs.base }}-runpod:${{ github.sha }}"
          echo "PATCHing endpoint ${RUNPOD_ENDPOINT_ID} → ${IMAGE}"
          RESP=$(curl -sS -X PATCH \
            "https://api.runpod.io/v2/serverless/${RUNPOD_ENDPOINT_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -m 240 \
            -d "{\"image\": \"${IMAGE}\"}")
          echo "Response: ${RESP}"
          ACTUAL=$(echo "${RESP}" | python3 -c \
            'import sys, json
          try:
            d = json.load(sys.stdin)
            print(d.get("image", ""))
          except Exception:
            print("")')
          if [ "${ACTUAL}" != "${IMAGE}" ]; then
            echo "ERROR: endpoint image did not update to ${IMAGE}" >&2
            echo "Got: ${ACTUAL}" >&2
            exit 1
          fi
          echo "OK: endpoint ${RUNPOD_ENDPOINT_ID} now at ${ACTUAL}"

  # -----------------------------------------------------------------------
  # NOTE: object_info seeding used to live here as a `seed-object-info` job
  # chained off build-base. It has been extracted to a standalone workflow:
  #
  #   .github/workflows/seed-object-info.yml
  #
  # That workflow auto-fires via `workflow_run` when this Docker Build
  # workflow completes successfully on main (so freshly-built images still
  # seed their object_info automatically), and also supports manual
  # `workflow_dispatch` for re-seeding without rebuilding the image
  # (e.g. after a Worker-side bug fix, secret rotation, or API endpoint
  # change). See that file for setup instructions.
  # -----------------------------------------------------------------------
