name: Docker Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_base_rebuild:
        description: "Rebuild the full base even when its content-hash tag exists"
        required: false
        type: boolean
        default: false
      publish_runtime:
        description: "Publish the verified runtime archive to the configured object store"
        required: false
        type: boolean
        default: false
      channel:
        description: "Mutable runtime channel pointer (for example, staging)"
        required: false
        type: string
        default: staging

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SAGEATTN_VERSION: "2.2.0"

jobs:
  build-sageattn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image name (lowercase)
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete-sageattn" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if sageattn image already exists
        id: check
        run: |
          if docker manifest inspect ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} >/dev/null 2>&1; then
            echo "skipped=true" >> $GITHUB_OUTPUT
            echo "Image ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} already exists — skipping build"
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "Image not found — will build"
          fi

      - name: Free disk space and move Docker data to /mnt
        if: steps.check.outputs.skipped != 'true'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          # Add swap as safety net during CUDA compilation.
          # Tolerant: newer ubuntu-latest images sometimes ship a pre-active
          # swapfile at /mnt/swapfile → ETXTBSY. Skip silently if so.
          if ! swapon --show --name=swapfile 2>/dev/null | grep -q swapfile; then
            sudo fallocate -l 16G /mnt/swapfile 2>/dev/null || true
            sudo chmod 600 /mnt/swapfile 2>/dev/null || true
            sudo mkswap /mnt/swapfile 2>/dev/null || true
            sudo swapon /mnt/swapfile 2>/dev/null || true
          fi
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker
          echo "=== Memory ==="
          free -h

      - uses: actions/checkout@v7
        if: steps.check.outputs.skipped != 'true'

      - name: Build and push sageattn wheels
        if: steps.check.outputs.skipped != 'true'
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/sageattn.Dockerfile \
            --build-arg SAGEATTN_VERSION=${{ env.SAGEATTN_VERSION }} \
            -t ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }} \
            -t ${{ steps.img.outputs.name }}:latest \
            .
          docker push ${{ steps.img.outputs.name }}:${{ env.SAGEATTN_VERSION }}
          docker push ${{ steps.img.outputs.name }}:latest

  build-base:
    needs: build-sageattn
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      base_tag: ${{ steps.base.outputs.tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker

      - uses: actions/checkout@v7

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - name: Calculate base content hash
        id: base
        run: |
          HASH=$({
            printf 'SAGEATTN_VERSION=%s\n' "${{ env.SAGEATTN_VERSION }}"
            sha256sum \
              docker/Dockerfile.cloudbuild \
              docker/entrypoint.sh \
              requirements.txt \
              scripts/install_custom_nodes.py \
              scripts/sanitize_elf_search_paths.py \
              supported_nodes.yaml \
              version_lock.yaml
          } | sha256sum | cut -d' ' -f1)
          echo "tag=base-${HASH:0:16}" >> "$GITHUB_OUTPUT"
          echo "Base content tag: base-${HASH:0:16}"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for reusable base image
        id: existing
        run: |
          IMAGE="${{ steps.img.outputs.base }}:${{ steps.base.outputs.tag }}"
          FORCE="${{ inputs.force_base_rebuild || false }}"
          if [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing ${IMAGE}"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Building ${IMAGE}"
          fi

      - name: Build and push base image
        if: steps.existing.outputs.reuse != 'true'
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.cloudbuild \
            --build-arg SAGEATTN_VERSION=${{ env.SAGEATTN_VERSION }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from ${{ steps.img.outputs.base }}:latest \
            --target base \
            -t ${{ steps.img.outputs.base }}:latest \
            -t ${{ steps.img.outputs.base }}:${{ steps.base.outputs.tag }} \
            -t ${{ steps.img.outputs.base }}:${{ github.sha }} \
            .
          docker push ${{ steps.img.outputs.base }}:latest
          docker push ${{ steps.img.outputs.base }}:${{ steps.base.outputs.tag }}
          docker push ${{ steps.img.outputs.base }}:${{ github.sha }}

      - name: Tag reusable base for this commit
        if: steps.existing.outputs.reuse == 'true'
        uses: imjasonh/setup-crane@v0.4

      - name: Publish commit tags for reusable base
        if: steps.existing.outputs.reuse == 'true'
        run: |
          SOURCE="${{ steps.img.outputs.base }}:${{ steps.base.outputs.tag }}"
          crane tag "$SOURCE" "${{ github.sha }}"
          crane tag "$SOURCE" latest

  build-runpod:
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - name: Calculate RunPod wrapper content hash
        id: wrapper
        run: |
          set -euo pipefail
          HASH=$({
            printf 'base_tag=%s\n' "${{ needs.build-base.outputs.base_tag }}"
            sha256sum \
              docker/Dockerfile.runpod \
              docker/runpod/start.sh \
              docker/runpod/handler.py \
              docker/runpod/network_volume.py \
              docker/runpod/extra_model_paths.yaml \
              docker/runpod/comfy-manager-set-mode.sh \
              docker/runpod/comfy-node-install.sh | LC_ALL=C sort
          } | sha256sum | cut -d' ' -f1)
          echo "tag=runpod-${HASH:0:16}" >> "$GITHUB_OUTPUT"
          echo "RunPod wrapper content tag: runpod-${HASH:0:16}"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for reusable RunPod wrapper image
        id: existing
        run: |
          set -euo pipefail
          IMAGE="${{ steps.img.outputs.base }}-runpod:${{ steps.wrapper.outputs.tag }}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing ${IMAGE}"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Wrapper image not found — will build ${IMAGE}"
          fi

      - name: Free disk space and move Docker data to /mnt
        if: steps.existing.outputs.reuse != 'true'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker

      - name: Build and push RunPod wrapper image
        if: steps.existing.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.img.outputs.base }}-runpod"
          CONTENT_TAG="${{ steps.wrapper.outputs.tag }}"
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.runpod \
            --build-arg BASE_IMAGE=${{ steps.img.outputs.base }}:${{ needs.build-base.outputs.base_tag }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "$IMAGE:latest" \
            -t "$IMAGE:$CONTENT_TAG" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            .
          docker push "$IMAGE:$CONTENT_TAG"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Install crane for reusable RunPod wrapper tags
        if: steps.existing.outputs.reuse == 'true'
        uses: imjasonh/setup-crane@v0.4

      - name: Publish commit tags for reusable RunPod wrapper
        if: steps.existing.outputs.reuse == 'true'
        run: |
          set -euo pipefail
          SOURCE="${{ steps.img.outputs.base }}-runpod:${{ steps.wrapper.outputs.tag }}"
          crane tag "$SOURCE" "${{ github.sha }}"
          crane tag "$SOURCE" latest

  build-pod:
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - name: Calculate Pod wrapper content hash
        id: wrapper
        run: |
          set -euo pipefail
          HASH=$({
            printf 'base_tag=%s\n' "${{ needs.build-base.outputs.base_tag }}"
            sha256sum \
              docker/Dockerfile.pod \
              docker/pod/start.sh \
              docker/pod/gateway.py \
              docker/pod/model_bootstrap.py \
              docker/pod/asset_sync.py \
              docker/runpod/comfy-manager-set-mode.sh | LC_ALL=C sort
          } | sha256sum | cut -d' ' -f1)
          echo "tag=pod-${HASH:0:16}" >> "$GITHUB_OUTPUT"
          echo "Pod wrapper content tag: pod-${HASH:0:16}"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for reusable Pod wrapper image
        id: existing
        run: |
          set -euo pipefail
          IMAGE="${{ steps.img.outputs.base }}-pod:${{ steps.wrapper.outputs.tag }}"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing ${IMAGE}"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Wrapper image not found — will build ${IMAGE}"
          fi

      - name: Free disk space and move Docker data to /mnt
        if: steps.existing.outputs.reuse != 'true'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          df -h / /mnt /var/lib/docker

      - name: Build and push Pod wrapper image
        if: steps.existing.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          IMAGE="${{ steps.img.outputs.base }}-pod"
          CONTENT_TAG="${{ steps.wrapper.outputs.tag }}"
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.pod \
            --build-arg BASE_IMAGE=${{ steps.img.outputs.base }}:${{ needs.build-base.outputs.base_tag }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "$IMAGE:latest" \
            -t "$IMAGE:$CONTENT_TAG" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            .
          docker push "$IMAGE:$CONTENT_TAG"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Install crane for reusable Pod wrapper tags
        if: steps.existing.outputs.reuse == 'true'
        uses: imjasonh/setup-crane@v0.4

      - name: Publish commit tags for reusable Pod wrapper
        if: steps.existing.outputs.reuse == 'true'
        run: |
          set -euo pipefail
          SOURCE="${{ steps.img.outputs.base }}-pod:${{ steps.wrapper.outputs.tag }}"
          crane tag "$SOURCE" "${{ github.sha }}"
          crane tag "$SOURCE" latest

  build-hydrator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image base (lowercase)
        id: img
        run: echo "base=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push model hydrator image
        run: |
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.hydrator \
            -t ${{ steps.img.outputs.base }}-hydrator:latest \
            -t ${{ steps.img.outputs.base }}-hydrator:${{ github.sha }} \
            .
          docker push ${{ steps.img.outputs.base }}-hydrator:latest
          docker push ${{ steps.img.outputs.base }}-hydrator:${{ github.sha }}


  # -----------------------------------------------------------------------
  # NOTE: object_info seeding used to live here as a `seed-object-info` job
  # chained off build-base. It has been extracted to a standalone workflow:
  #
  #   .github/workflows/seed-object-info.yml
  #
  # That workflow auto-fires via `workflow_run` when this Docker Build
  # workflow completes successfully on main (so freshly-built images still
  # seed their object_info automatically), and also supports manual
  # `workflow_dispatch` for re-seeding without rebuilding the image
  # (e.g. after a Worker-side bug fix, secret rotation, or API endpoint
  # change). See that file for setup instructions.
  # -----------------------------------------------------------------------

  # The portability gate intentionally runs as a separate, read-only job. It
  # consumes the exact content-addressed base tag produced above, so it never
  # rebuilds the image. The audit reads the final image rootfs from a
  # read-only, network-disabled container; it never scans this checkout and
  # no runtime archive is published.
  audit-base-runtime:
    needs: build-base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          echo "=== Disk space after cleanup ==="
          df -h / /mnt /var/lib/docker

      - uses: actions/checkout@v7

      - name: Limit Docker pull request bursts
        run: |
          set -euo pipefail
          sudo python3 .github/scripts/configure-docker-pulls.py
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig}}' >/dev/null

      - name: Set audit image and artifact paths
        id: audit-paths
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete:${{ needs.build-base.outputs.base_tag }}"
          AUDIT_DIR="$RUNNER_TEMP/runtime-audit"
          rm -rf "$AUDIT_DIR"
          mkdir -p "$AUDIT_DIR/probe-output" "$AUDIT_DIR/audit-output"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "audit_dir=$AUDIT_DIR" >> "$GITHUB_OUTPUT"
          echo "probe_dir=$AUDIT_DIR/probe-output" >> "$GITHUB_OUTPUT"
          echo "audit_output_dir=$AUDIT_DIR/audit-output" >> "$GITHUB_OUTPUT"
          echo "probe_volume=runtime-audit-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}" >> "$GITHUB_OUTPUT"
          echo "audit_volume=runtime-audit-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for the published base image
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the exact published base image
        run: |
          set -euo pipefail
          .github/scripts/docker-pull-with-retry.sh "${{ steps.audit-paths.outputs.image }}"

      - name: Prepare audit inputs from the exact final base image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.audit-paths.outputs.image }}"
          AUDIT_DIR="${{ steps.audit-paths.outputs.audit_dir }}"
          IMAGE_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")"
          test -n "$IMAGE_DIGEST"
          python3 - "$AUDIT_DIR/runtime-source.json" "$IMAGE" "$IMAGE_DIGEST" "${{ github.sha }}" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          destination, image, image_digest, build_sha = sys.argv[1:]
          Path(destination).write_text(
              json.dumps(
                  {
                      "schema_version": 2,
                      "source_image": image,
                      "source_image_digest": image_digest,
                      "build_sha": build_sha,
                      "rootfs_materialization": "exact-image-read-only-container",
                      "selected_rootfs_paths": ["/opt/conda", "/app/comfyui"],
                      "runtime_archive_published": False,
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          cp ci/runtime-selection-policy.json "$AUDIT_DIR/selection-policy.json"
          cp ci/runtime-launcher-inventory.json "$AUDIT_DIR/launcher-inventory.json"
          cp ci/runtime-portability-gate.json "$AUDIT_DIR/runtime-portability-gate.json"
          cp ci/runtime-critical-entrypoints.json "$AUDIT_DIR/runtime-critical-entrypoints.json"

      - name: Probe critical runtime imports in the final base container
        continue-on-error: true
        run: |
          set -euo pipefail
          AUDIT_DIR="${{ steps.audit-paths.outputs.audit_dir }}"
          PROBE_DIR="${{ steps.audit-paths.outputs.probe_dir }}"
          IMAGE="${{ steps.audit-paths.outputs.image }}"
          PROBE_VOLUME="${{ steps.audit-paths.outputs.probe_volume }}"
          PROBE_CONTAINER="runtime-audit-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          cleanup_probe_container() {
            docker rm -f "$PROBE_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_probe_container EXIT
          docker volume create "$PROBE_VOLUME" >/dev/null
          docker create --name "$PROBE_CONTAINER" \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            -e CUDA_VISIBLE_DEVICES= \
            -e HOME=/tmp \
            -e XDG_CACHE_HOME=/tmp/xdg-cache \
            -e XDG_CONFIG_HOME=/tmp/xdg-config \
            -e XDG_DATA_HOME=/tmp/xdg-data \
            -e TMPDIR=/tmp \
            -e PYTHONNOUSERSITE=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH= \
            --entrypoint /opt/conda/bin/python \
            --mount type=volume,source="$PROBE_VOLUME",destination=/audit \
            -v "$PWD/scripts/runtime_critical_probe.py:/runtime-audit/runtime_critical_probe.py:ro" \
            -v "$PWD/scripts/runtime_portability_audit.py:/runtime-audit/runtime_portability_audit.py:ro" \
            -v "$PWD/ci:/runtime-audit/ci:ro" \
            "${{ steps.audit-paths.outputs.image }}" \
            /runtime-audit/runtime_critical_probe.py \
            --config /runtime-audit/ci/runtime-critical-entrypoints.json \
            --profile cpu \
            --output /audit/critical-probe.json
          set +e
          docker start -a "$PROBE_CONTAINER" 2>&1 | tee "$AUDIT_DIR/critical-probe.log"
          probe_status=${PIPESTATUS[0]}
          set -e
          set +e
          CAT_BIN=/bin/cat
          if docker run --rm \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c 'test -x /bin/cat' \
            > /dev/null \
            2> "$AUDIT_DIR/critical-probe-cat-check.log"; then
            :
          elif docker run --rm \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c 'test -x /usr/bin/cat' \
            > /dev/null \
            2> "$AUDIT_DIR/critical-probe-cat-check.log"; then
            CAT_BIN=/usr/bin/cat
          else
            echo "base image has neither /bin/cat nor /usr/bin/cat" >&2
            exit 1
          fi
          docker run --rm \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint "$CAT_BIN" \
            -v "$PROBE_VOLUME:/evidence:ro" \
            "$IMAGE" \
            /evidence/critical-probe.json \
            > "$PROBE_DIR/critical-probe.json" \
            2> "$AUDIT_DIR/critical-probe-copy.log"
          copy_status=$?
          set -e
          if [ ! -s "$PROBE_DIR/critical-probe.json" ]; then
            echo "critical probe did not produce /audit/critical-probe.json" >&2
            if [ "$probe_status" -eq 0 ]; then
              probe_status=1
            fi
          fi
          if [ "$copy_status" -ne 0 ] && [ "$probe_status" -eq 0 ]; then
            probe_status=1
          fi
          exit "$probe_status"

      - name: Materialize a blocker report if the critical probe produced no JSON
        if: ${{ always() }}
        run: |
          set -euo pipefail
          AUDIT_DIR="${{ steps.audit-paths.outputs.audit_dir }}"
          PROBE_DIR="${{ steps.audit-paths.outputs.probe_dir }}"
          IMAGE="${{ steps.audit-paths.outputs.image }}"
          PROBE_VOLUME="${{ steps.audit-paths.outputs.probe_volume }}"
          if [ -s "$PROBE_DIR/critical-probe.json" ] && python3 - "$PROBE_DIR/critical-probe.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              raise SystemExit(1)
          raise SystemExit(0 if isinstance(value, dict) else 1)
          PY
          then
            exit 0
          fi
          python3 - "$PROBE_DIR/critical-probe.json" ci/runtime-critical-entrypoints.json <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          from pathlib import Path

          destination, config_path = sys.argv[1:]
          config = json.loads(Path(config_path).read_text(encoding="utf-8"))
          digest = hashlib.sha256(
              json.dumps(config, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          Path(destination).write_text(
              json.dumps(
                  {
                      "schema_version": 3,
                      "profile": "base",
                      "probe_profile": "cpu",
                      "config_sha256": digest,
                      "status": "blocker",
                      "coverage": "incomplete",
                      "policy": {
                          "network": "none",
                          "rootfs": "read-only",
                          "writable_paths": ["/tmp", "/audit"],
                          "execution": "allowlisted-interpreter-only",
                          "gpu": "CUDA_VISIBLE_DEVICES-empty-no-explicit-init",
                      },
                      "main_script_compile": {
                          "path": "/app/comfyui/main.py",
                          "status": "failed",
                          "source_bytes": 0,
                          "error": "critical probe container did not produce a report",
                      },
                      "import_review": [],
                      "imports": [],
                      "error": "critical probe container did not produce a report",
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          docker run --rm \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /bin/sh \
            -v "$PROBE_DIR:/input:ro" \
            -v "$PROBE_VOLUME:/audit" \
            "$IMAGE" \
            -c 'cat /input/critical-probe.json > /audit/critical-probe.json' \
            > /dev/null \
            2> "$AUDIT_DIR/critical-probe-fallback-copy.log"

      - name: Audit the final base container rootfs
        run: |
          set -euo pipefail
          AUDIT_DIR="${{ steps.audit-paths.outputs.audit_dir }}"
          AUDIT_OUTPUT_DIR="${{ steps.audit-paths.outputs.audit_output_dir }}"
          IMAGE="${{ steps.audit-paths.outputs.image }}"
          PROBE_VOLUME="${{ steps.audit-paths.outputs.probe_volume }}"
          AUDIT_VOLUME="${{ steps.audit-paths.outputs.audit_volume }}"
          AUDIT_CONTAINER="runtime-audit-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          cleanup_audit_container() {
            docker rm -f "$AUDIT_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup_audit_container EXIT
          docker volume create "$AUDIT_VOLUME" >/dev/null
          docker create --name "$AUDIT_CONTAINER" \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            -e CUDA_VISIBLE_DEVICES= \
            -e HOME=/tmp \
            -e XDG_CACHE_HOME=/tmp/xdg-cache \
            -e XDG_CONFIG_HOME=/tmp/xdg-config \
            -e XDG_DATA_HOME=/tmp/xdg-data \
            -e TMPDIR=/tmp \
            -e PYTHONNOUSERSITE=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH= \
            --entrypoint /opt/conda/bin/python \
            --mount type=volume,source="$PROBE_VOLUME",destination=/audit-input,readonly \
            --mount type=volume,source="$AUDIT_VOLUME",destination=/audit-output \
            -v "$PWD/scripts/runtime_portability_audit.py:/runtime-audit/runtime_portability_audit.py:ro" \
            -v "$PWD/ci:/runtime-audit/ci:ro" \
            "${{ steps.audit-paths.outputs.image }}" \
            /runtime-audit/runtime_portability_audit.py \
            --source-root / \
            --selection-policy /runtime-audit/ci/runtime-selection-policy.json \
            --launcher-inventory /runtime-audit/ci/runtime-launcher-inventory.json \
            --gate-policy /runtime-audit/ci/runtime-portability-gate.json \
            --critical-config /runtime-audit/ci/runtime-critical-entrypoints.json \
            --critical-probe /audit-input/critical-probe.json \
            --critical-profile cpu \
            --max-entries 500000 \
            --max-findings 50000 \
            --output /audit-output/runtime-portability.json
          set +e
          docker start -a "$AUDIT_CONTAINER" 2>&1 | tee "$AUDIT_DIR/runtime-portability.log"
          audit_status=${PIPESTATUS[0]}
          set -e
          set +e
          CAT_BIN=/bin/cat
          if docker run --rm \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c 'test -x /bin/cat' \
            > /dev/null \
            2> "$AUDIT_DIR/runtime-portability-cat-check.log"; then
            :
          elif docker run --rm \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -c 'test -x /usr/bin/cat' \
            > /dev/null \
            2> "$AUDIT_DIR/runtime-portability-cat-check.log"; then
            CAT_BIN=/usr/bin/cat
          else
            echo "base image has neither /bin/cat nor /usr/bin/cat" >&2
            exit 1
          fi
          docker run --rm \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint "$CAT_BIN" \
            -v "$AUDIT_VOLUME:/evidence:ro" \
            "$IMAGE" \
            /evidence/runtime-portability.json \
            > "$AUDIT_OUTPUT_DIR/runtime-portability.json" \
            2> "$AUDIT_DIR/runtime-portability-copy.log"
          copy_status=$?
          set -e
          if [ ! -s "$AUDIT_OUTPUT_DIR/runtime-portability.json" ]; then
            echo "runtime portability audit did not produce /audit-output/runtime-portability.json" >&2
            if [ "$audit_status" -eq 0 ]; then
              audit_status=1
            fi
          fi
          if [ "$copy_status" -ne 0 ] && [ "$audit_status" -eq 0 ]; then
            audit_status=1
          fi
          exit "$audit_status"

      - name: Upload runtime portability reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-portability-${{ github.run_id }}
          path: ${{ steps.audit-paths.outputs.audit_dir }}
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary audit files
        if: ${{ always() }}
        run: |
          set -euo pipefail
          docker rm -f \
            "runtime-audit-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}" \
            "runtime-audit-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}" \
            >/dev/null 2>&1 || true
          for volume in \
            "${{ steps.audit-paths.outputs.probe_volume }}" \
            "${{ steps.audit-paths.outputs.audit_volume }}"; do
            if [ -n "$volume" ]; then
              docker volume rm "$volume" >/dev/null 2>&1 || true
            fi
          done
          rm -rf "${{ steps.audit-paths.outputs.audit_dir }}"

  # Export and verify the exact immutable runtime, then publish only the thin
  # launcher image. The large archive remains local to this runner unless an
  # explicit workflow_dispatch enables the object-store publisher; GitHub
  # Artifacts receives metadata only, avoiding multi-gigabyte artifact storage
  # and transfer charges.
  publish-runtime-slim:
    needs: [build-base, audit-base-runtime]
    runs-on: ubuntu-latest
    # The environment permits deployments from main only. This prevents a
    # workflow_dispatch on an unreviewed branch from receiving publication
    # credentials, even if that branch edits the step-level condition.
    environment: runtime-publication
    # The first production-sized export exceeded 80 minutes before reaching
    # archive verification. Keep the platform maximum as a temporary safety
    # ceiling until the exporter is converted to streaming/multithreaded zstd.
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space and move Docker data to /mnt
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/share/edge \
            /usr/local/share/firefox \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          sudo systemctl stop docker
          sudo rm -rf /var/lib/docker
          sudo mkdir -p /mnt/docker-data
          sudo ln -s /mnt/docker-data /var/lib/docker
          sudo systemctl start docker
          # The exporter runs as container root with DAC_OVERRIDE dropped.
          # Root ownership lets it write without widening capabilities; the
          # runner's primary group retains host-side access to the results.
          sudo install -d -o 0 -g "$(id -g)" -m 0770 /mnt/runtime-export
          df -h / /mnt /var/lib/docker

      - uses: actions/checkout@v7

      - name: Limit Docker pull request bursts
        run: |
          set -euo pipefail
          sudo python3 .github/scripts/configure-docker-pulls.py
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig}}' >/dev/null

      - name: Download the audited portability evidence
        uses: actions/download-artifact@v4
        with:
          name: runtime-portability-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-portability

      - name: Require the critical portability gate
        run: |
          set -euo pipefail
          REPORT="$(find "$RUNNER_TEMP/runtime-portability" -type f -name runtime-portability.json -print -quit)"
          python3 - "$REPORT" <<'PY'
          import json
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit("runtime portability report is missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          gate = report.get("gate", {})
          if gate.get("status") != "pass" or gate.get("source") != "critical":
              raise SystemExit(f"runtime critical portability gate did not pass: {gate!r}")
          static_policy = gate.get("static_policy")
          if not isinstance(static_policy, dict) or static_policy.get("status") != "pass":
              raise SystemExit(f"runtime static portability policy gate did not pass: {static_policy!r}")
          print(json.dumps(gate, sort_keys=True))
          PY

      - name: Set immutable image identities
        id: identity
        run: |
          set -euo pipefail
          IMAGE_BASE="ghcr.io/$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/comfy-complete"
          LAUNCHER_ABI="comfy-pod-launcher/v1"
          LAUNCHER_HASH=$({
            printf 'launcher_abi=%s\n' "$LAUNCHER_ABI"
            sha256sum \
              docker/Dockerfile.pod-slim \
              docker/pod/runtime_launcher.py \
              docker/pod/start.sh \
              docker/pod/gateway.py \
              docker/pod/model_bootstrap.py \
              docker/pod/asset_sync.py \
              docker/runpod/comfy-manager-set-mode.sh \
              scripts/runtime_manifest.py | LC_ALL=C sort
          } | sha256sum | cut -d' ' -f1)
          echo "base_image=${IMAGE_BASE}:${{ needs.build-base.outputs.base_tag }}" >> "$GITHUB_OUTPUT"
          echo "slim_image=${IMAGE_BASE}-pod-slim:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "launcher_abi=$LAUNCHER_ABI" >> "$GITHUB_OUTPUT"
          echo "launcher_digest=sha256:$LAUNCHER_HASH" >> "$GITHUB_OUTPUT"
          echo "runtime_dir=/mnt/runtime-export" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the audited base image
        run: |
          set -euo pipefail
          .github/scripts/docker-pull-with-retry.sh "${{ steps.identity.outputs.base_image }}"

      - name: Build the runtime exporter helper
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Dockerfile.runtime-exporter" <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          USER root
          RUN apt-get -o Acquire::Retries=3 update && \
              apt-get install -y --no-install-recommends zstd && \
              apt-get clean && rm -rf /var/lib/apt/lists/*
          COPY scripts/export_runtime.py scripts/runtime_manifest.py /runtime-tools/
          ENTRYPOINT ["/opt/conda/bin/python", "/runtime-tools/export_runtime.py"]
          EOF
          DOCKER_BUILDKIT=1 docker build \
            -f "$RUNNER_TEMP/Dockerfile.runtime-exporter" \
            --build-arg BASE_IMAGE="${{ steps.identity.outputs.base_image }}" \
            -t comfy-runtime-exporter:${{ github.sha }} \
            .

      - name: Export and fully verify the immutable runtime
        run: |
          set -euo pipefail
          BASE_IMAGE="${{ steps.identity.outputs.base_image }}"
          RUNTIME_DIR="${{ steps.identity.outputs.runtime_dir }}"
          REPO_DIGEST="$(docker image inspect --format '{{index .RepoDigests 0}}' "$BASE_IMAGE")"
          IMAGE_DIGEST="sha256:${REPO_DIGEST##*@sha256:}"
          test "$IMAGE_DIGEST" != "sha256:"
          rm -rf "$RUNTIME_DIR"/*
          docker run --rm \
            --network none \
            --pids-limit 512 \
            --cap-drop ALL \
            --cap-add DAC_READ_SEARCH \
            --security-opt no-new-privileges \
            -v "$RUNTIME_DIR:/runtime-output" \
            comfy-runtime-exporter:${{ github.sha }} \
            --source-root / \
            --output-dir /runtime-output \
            --runtime-version "${{ github.sha }}" \
            --source-image "$BASE_IMAGE" \
            --source-image-digest "$IMAGE_DIGEST" \
            --build-sha "${{ github.sha }}" \
            --platform linux/amd64 \
            --launcher-digest "${{ steps.identity.outputs.launcher_digest }}" \
            --launcher-abi "${{ steps.identity.outputs.launcher_abi }}" \
            --entrypoint /opt/conda/bin/python \
            --entrypoint-arg /app/comfyui/main.py
          MANIFEST="$(find "$RUNTIME_DIR" -maxdepth 1 -type f -name 'sha256-*.json' -print -quit)"
          ARCHIVE="$(find "$RUNTIME_DIR" -maxdepth 1 -type f -name 'sha256-*.tar.zst' -print -quit)"
          test -n "$MANIFEST" -a -n "$ARCHIVE"
          cp "$MANIFEST" "$RUNTIME_DIR/manifest.json"
          python3 scripts/runtime_ready.py \
            --manifest "$RUNTIME_DIR/manifest.json" \
            --output "$RUNTIME_DIR/READY.json"
          python3 - "$RUNTIME_DIR/manifest.json" "$RUNTIME_DIR/READY.json" "$ARCHIVE" "$RUNTIME_DIR/runtime-summary.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          manifest_path, ready_path, archive_path, summary_path = map(Path, sys.argv[1:])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          ready = json.loads(ready_path.read_text(encoding="utf-8"))
          Path(summary_path).write_text(
              json.dumps(
                  {
                      "runtime_digest": manifest["runtime_digest"],
                      "launcher_digest": manifest["compatibility"]["launcher_digest"],
                      "launcher_abi": manifest["compatibility"]["launcher_abi"],
                      "runtime_tree_bytes": manifest["file_tree"]["total_bytes"],
                      "runtime_entry_count": manifest["file_tree"]["entry_count"],
                      "archive_bytes": archive_path.stat().st_size,
                      "archive_sha256": manifest["archive"]["sha256"],
                      "manifest_sha256": ready["manifest_sha256"],
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              ) + "\n",
              encoding="utf-8",
          )
          PY
          cat "$RUNTIME_DIR/runtime-summary.json"
          df -h "$RUNNER_TEMP"

      - name: Build and inspect the slim launcher image
        run: |
          set -euo pipefail
          DOCKER_BUILDKIT=1 docker build \
            -f docker/Dockerfile.pod-slim \
            --build-arg LAUNCHER_DIGEST="${{ steps.identity.outputs.launcher_digest }}" \
            --build-arg LAUNCHER_ABI="${{ steps.identity.outputs.launcher_abi }}" \
            -t "${{ steps.identity.outputs.slim_image }}" \
            .
          SIZE="$(docker image inspect --format '{{.Size}}' '${{ steps.identity.outputs.slim_image }}')"
          # FFmpeg 6's libavdevice closure intentionally carries the Ubuntu
          # GL/audio device ABI. Keep a hard ceiling while allowing that
          # reviewed closure; the runtime payload itself is still excluded.
          test "$SIZE" -lt 671088640
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' '${{ steps.identity.outputs.slim_image }}')" = '["/usr/bin/dumb-init","--","/runtime-launcher.py"]'
          python3 - "$SIZE" "${{ steps.identity.outputs.runtime_dir }}/slim-image.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          size, destination = sys.argv[1:]
          Path(destination).write_text(
              json.dumps(
                  {
                      "image": "${{ steps.identity.outputs.slim_image }}",
                      "size_bytes": int(size),
                      "launcher_digest": "${{ steps.identity.outputs.launcher_digest }}",
                      "launcher_abi": "${{ steps.identity.outputs.launcher_abi }}",
                  },
                  sort_keys=True,
                  separators=(",", ":"),
          ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate and verify the slim launcher inventory
        run: |
          set -euo pipefail
          INVENTORY_DIR="$RUNNER_TEMP/slim-launcher-inventory"
          GENERATED="$INVENTORY_DIR/runtime-launcher-inventory.json"
          mkdir -p "$INVENTORY_DIR"
          docker run --rm \
            --network none \
            --read-only \
            --pids-limit 128 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --entrypoint /usr/bin/python3 \
            -v "$PWD/scripts/runtime_launcher_inventory.py:/runtime-launcher-inventory.py:ro" \
            -v "$INVENTORY_DIR:/inventory-output" \
            "${{ steps.identity.outputs.slim_image }}" \
            /runtime-launcher-inventory.py \
            --root / \
            --injected-library libcuda.so.1 \
            --output /inventory-output/runtime-launcher-inventory.json
          diff -u ci/runtime-launcher-inventory.json "$GENERATED"

      - name: Smoke-test slim launcher image contract
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' '${{ steps.identity.outputs.slim_image }}')" = '["/usr/bin/dumb-init","--","/runtime-launcher.py"]'
          docker run --rm \
            -i \
            --network none \
            --read-only \
            --pids-limit 128 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m \
            --entrypoint /bin/sh \
            "${{ steps.identity.outputs.slim_image }}" \
            -eu -s <<'SH'
          for required in \
            /runtime-launcher.py \
            /start-pod.sh \
            /launcher-lib/runtime_manifest.py \
            /pod-gateway.py \
            /pod-model-bootstrap.py \
            /pod-asset-sync.py \
            /usr/local/bin/comfy-manager-set-mode; do
            test -f "$required"
          done
          test -x /runtime-launcher.py
          test -x /start-pod.sh
          test -x /usr/local/bin/comfy-manager-set-mode
          test -x /usr/bin/dumb-init
          test -x /usr/bin/env
          for command in bash python3 dumb-init env ffmpeg; do
            executable="$(command -v "$command")"
            test -n "$executable"
            test -x "$executable"
          done
          bash -n /start-pod.sh
          bash -n /usr/local/bin/comfy-manager-set-mode
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/launcher-lib python3 -c '
          import importlib.util
          import runtime_manifest
          import sys

          spec = importlib.util.spec_from_file_location("runtime_launcher", "/runtime-launcher.py")
          if spec is None or spec.loader is None:
              raise SystemExit("runtime launcher import spec is missing")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          # These helpers intentionally run with the mounted runtime's
          # /opt/conda Python after runtime_launcher installs that link. The
          # base-image critical probe separately imports aiohttp and the core
          # runtime dependencies; here the slim system Python validates source
          # syntax without pretending to own those runtime packages.
          for path in ("/pod-gateway.py", "/pod-model-bootstrap.py", "/pod-asset-sync.py"):
              with open(path, "rb") as source:
                  compile(source.read(), path, "exec")
          '
          SH

      # The base and exporter images have already done their work by this
      # point. Release their local layers before creating the second copy of
      # the runtime on the runner. The archive and its manifest remain in
      # RUNTIME_DIR until the publisher and final cleanup have completed.
      - name: Release base and exporter images before local volume materialization
        run: |
          set -euo pipefail
          docker image rm "comfy-runtime-exporter:${{ github.sha }}" >/dev/null 2>&1 || true
          docker image rm "${{ steps.identity.outputs.base_image }}" >/dev/null 2>&1 || true
          df -h / /mnt "${{ steps.identity.outputs.runtime_dir }}"

      - name: Materialize runtime into a local simulated Network Volume
        id: runtime-materializer
        run: |
          set -euo pipefail
          RUNTIME_DIR="${{ steps.identity.outputs.runtime_dir }}"
          RUNTIME_VOLUME="$RUNTIME_DIR/.runtime-volume"
          SMOKE_AUDIT="$RUNTIME_DIR/.runtime-volume-smoke"
          rm -rf "$RUNTIME_VOLUME" "$SMOKE_AUDIT"
          mkdir -p "$RUNTIME_VOLUME" "$SMOKE_AUDIT"
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zstd
            sudo rm -rf /var/lib/apt/lists/*
          fi
          ARCHIVE="$(find "$RUNTIME_DIR" -maxdepth 1 -type f -name 'sha256-*.tar.zst' -print -quit)"
          test -n "$ARCHIVE"
          python3 scripts/materialize_runtime.py \
            --archive "$ARCHIVE" \
            --manifest "$RUNTIME_DIR/manifest.json" \
            --volume-root "$RUNTIME_VOLUME" \
            > "$RUNTIME_DIR/runtime-materializer.json"
          python3 - "$RUNTIME_DIR/runtime-materializer.json" "$RUNTIME_VOLUME" <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import sys

          result_path, volume_root = map(Path, sys.argv[1:])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          if result.get("status") != "materialized":
              raise SystemExit(f"runtime materializer did not publish a fresh generation: {result!r}")
          if result.get("current_updated") is not True:
              raise SystemExit(f"runtime materializer did not update current: {result!r}")
          current = volume_root / "runtimes" / "current"
          if not current.is_symlink() or not current.resolve(strict=True).is_dir():
              raise SystemExit("materialized runtime current symlink is invalid")
          PY
          echo "runtime_volume=$RUNTIME_VOLUME" >> "$GITHUB_OUTPUT"
          echo "smoke_audit=$SMOKE_AUDIT" >> "$GITHUB_OUTPUT"
          test -s "$ARCHIVE"

      - name: Smoke-test materialized runtime through slim launcher contracts
        run: |
          set -euo pipefail
          RUNTIME_DIR="${{ steps.identity.outputs.runtime_dir }}"
          RUNTIME_VOLUME="${{ steps.runtime-materializer.outputs.runtime_volume }}"
          SMOKE_AUDIT="${{ steps.runtime-materializer.outputs.smoke_audit }}"
          IMAGE="${{ steps.identity.outputs.slim_image }}"
          CURRENT="$RUNTIME_VOLUME/runtimes/current"
          test -L "$CURRENT"
          test -f "$CURRENT/manifest.json"
          test -f "$CURRENT/READY.json"
          docker run --rm \
            -i \
            --network none \
            --read-only \
            --pids-limit 256 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=256m \
            --tmpfs /opt:rw,nosuid,nodev,size=16m \
            --tmpfs /app:rw,nosuid,nodev,noexec,size=32m \
            --mount type=bind,source="$RUNTIME_VOLUME",destination=/runpod-volume,readonly \
            --mount type=bind,source="$SMOKE_AUDIT",destination=/audit \
            -v "$PWD/scripts/runtime_critical_probe.py:/runtime-audit/runtime_critical_probe.py:ro" \
            -v "$PWD/scripts/runtime_portability_audit.py:/runtime-audit/runtime_portability_audit.py:ro" \
            -v "$PWD/ci:/runtime-audit/ci:ro" \
            -e COMFY_EXPECTED_LAUNCHER_DIGEST="${{ steps.identity.outputs.launcher_digest }}" \
            -e COMFY_EXPECTED_LAUNCHER_ABI="${{ steps.identity.outputs.launcher_abi }}" \
            -e COMFY_EXPECTED_RUNTIME_PLATFORM=linux/amd64 \
            -e CUDA_VISIBLE_DEVICES= \
            -e HOME=/tmp \
            -e XDG_CACHE_HOME=/tmp/xdg-cache \
            -e XDG_CONFIG_HOME=/tmp/xdg-config \
            -e XDG_DATA_HOME=/tmp/xdg-data \
            -e TMPDIR=/tmp \
            -e PYTHONNOUSERSITE=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH= \
            --entrypoint /bin/sh \
            "$IMAGE" \
            -eu -s <<'SH'
          RUNTIME_ROOT=/runpod-volume/runtimes/current
          PYTHONPATH=/launcher-lib python3 - "$RUNTIME_ROOT" <<'PY'
          from __future__ import annotations

          import importlib.util
          import os
          from pathlib import Path
          import sys

          runtime_root = Path(sys.argv[1]).resolve(strict=True)
          spec = importlib.util.spec_from_file_location("runtime_launcher", "/runtime-launcher.py")
          if spec is None or spec.loader is None:
              raise SystemExit("runtime launcher import spec is missing")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          manifest_path = runtime_root / "manifest.json"
          ready_path = runtime_root / "READY.json"
          manifest = module.load_verified_manifest(
              manifest_path,
              ready_path,
              launcher_digest=os.environ["COMFY_EXPECTED_LAUNCHER_DIGEST"],
              launcher_abi=os.environ["COMFY_EXPECTED_LAUNCHER_ABI"],
              platform=os.environ["COMFY_EXPECTED_RUNTIME_PLATFORM"],
          )
          # This is the same launch-critical verification the real launcher
          # performs. Do not call launch(): it would enter the GPU supervisor.
          module.verify_runtime_tree(runtime_root, manifest)
          module.install_compatibility_link(Path("/opt/conda"), runtime_root / "opt/conda")
          module.install_comfy_projection(Path("/app/comfyui"), runtime_root / "app/comfyui")
          if not Path("/opt/conda").is_symlink():
              raise SystemExit("/opt/conda compatibility link was not installed")
          projected = Path("/app/comfyui")
          if not projected.is_dir() or projected.is_symlink():
              raise SystemExit("ComfyUI runtime projection was not installed")
          PY

          /opt/conda/bin/python - <<'PY'
          from __future__ import annotations

          import aiohttp
          import importlib.util
          from pathlib import Path
          import sys

          conda_root = Path("/opt/conda").resolve(strict=True)
          aiohttp_file = Path(aiohttp.__file__).resolve(strict=True)
          try:
              aiohttp_file.relative_to(conda_root)
          except ValueError as error:
              raise SystemExit(f"aiohttp was not imported from projected /opt/conda: {aiohttp_file}") from error
          spec = importlib.util.spec_from_file_location("pod_gateway", "/pod-gateway.py")
          if spec is None or spec.loader is None:
              raise SystemExit("gateway import spec is missing")
          gateway = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = gateway
          spec.loader.exec_module(gateway)
          if gateway.ClientSession is not aiohttp.ClientSession:
              raise SystemExit("gateway did not bind the projected aiohttp ClientSession")
          PY

          /opt/conda/bin/python /runtime-audit/runtime_critical_probe.py \
            --config /runtime-audit/ci/runtime-critical-entrypoints.json \
            --profile cpu \
            --output /audit/critical-probe.json
          /opt/conda/bin/python - /audit/critical-probe.json <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("probe_profile") != "cpu" or report.get("status") == "blocker":
              raise SystemExit(f"projected runtime CPU critical probe failed: {report.get('status')}")
          aiohttp_results = [item for item in report.get("imports", []) if item.get("module") == "aiohttp"]
          if len(aiohttp_results) != 1 or aiohttp_results[0].get("status") != "pass":
              raise SystemExit("projected runtime CPU probe did not pass aiohttp")
          PY
          SH
          test -s "$SMOKE_AUDIT/critical-probe.json"
          cp "$SMOKE_AUDIT/critical-probe.json" "$RUNTIME_DIR/runtime-critical-probe.json"
          python3 - "$RUNTIME_DIR/runtime-launcher-smoke.json" "$CURRENT/manifest.json" "$SMOKE_AUDIT/critical-probe.json" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import sys

          destination, manifest_path, probe_path = map(Path, sys.argv[1:])
          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes)
          probe = json.loads(probe_path.read_text(encoding="utf-8"))
          destination.write_text(
              json.dumps(
                  {
                      "runtime_digest": manifest["runtime_digest"],
                      "manifest_sha256": hashlib.sha256(manifest_bytes).hexdigest(),
                      "probe_profile": probe["probe_profile"],
                      "probe_status": probe["status"],
                      "probe_coverage": probe["coverage"],
                  },
                  sort_keys=True,
                  separators=(",", ":"),
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove local simulated runtime volume after smoke
        if: ${{ always() }}
        run: |
          set -euo pipefail
          RUNTIME_VOLUME="${{ steps.runtime-materializer.outputs.runtime_volume }}"
          SMOKE_AUDIT="${{ steps.runtime-materializer.outputs.smoke_audit }}"
          if [ -n "$RUNTIME_VOLUME" ]; then rm -rf "$RUNTIME_VOLUME"; fi
          if [ -n "$SMOKE_AUDIT" ]; then rm -rf "$SMOKE_AUDIT"; fi

      - name: Push the immutable slim launcher image
        run: docker push "${{ steps.identity.outputs.slim_image }}"

      # Object-store credentials are referenced only by this explicitly
      # enabled workflow_dispatch step. Pushes to main cannot reach it and
      # therefore do not receive object-store secrets or upload the archive.
      - name: Validate runtime publication channel
        id: runtime-publication-inputs
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_runtime == true }}
        env:
          RUNTIME_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "$RUNTIME_CHANNEL" == "." || "$RUNTIME_CHANNEL" == ".." || ! "$RUNTIME_CHANNEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "channel must be one safe path component (1-128 ASCII letters, digits, '.', '_', or '-')" >&2
            exit 1
          fi
          printf 'channel=%s\n' "$RUNTIME_CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Publish verified runtime archive to object store
        id: runtime-publisher
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_runtime == true }}
        env:
          OBJECT_STORE_ENDPOINT: ${{ secrets.OBJECT_STORE_ENDPOINT }}
          OBJECT_STORE_BUCKET: ${{ secrets.OBJECT_STORE_BUCKET }}
          OBJECT_STORE_ACCESS_KEY_ID: ${{ secrets.OBJECT_STORE_ACCESS_KEY_ID }}
          OBJECT_STORE_SECRET_ACCESS_KEY: ${{ secrets.OBJECT_STORE_SECRET_ACCESS_KEY }}
          OBJECT_STORE_REGION: ${{ secrets.OBJECT_STORE_REGION }}
          OBJECT_STORE_PREFIX: ${{ secrets.OBJECT_STORE_PREFIX }}
          RUNTIME_CHANNEL: ${{ steps.runtime-publication-inputs.outputs.channel }}
        run: |
          set -euo pipefail
          PUBLISH_VENV="$RUNNER_TEMP/runtime-publisher-venv"
          python3 -m venv "$PUBLISH_VENV"
          "$PUBLISH_VENV/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            'boto3==1.40.0'
          RUNTIME_DIR="${{ steps.identity.outputs.runtime_dir }}"
          ARCHIVE="$(find "$RUNTIME_DIR" -maxdepth 1 -type f -name 'sha256-*.tar.zst' -print -quit)"
          test -n "$ARCHIVE"
          PUBLISH_RESULT="$RUNTIME_DIR/runtime-publisher.json"
          "$PUBLISH_VENV/bin/python" scripts/publish_runtime.py \
            --archive "$ARCHIVE" \
            --manifest "$RUNTIME_DIR/manifest.json" \
            --channel "$RUNTIME_CHANNEL" \
            --require-config \
            > "$PUBLISH_RESULT"
          python3 - "$PUBLISH_RESULT" "$GITHUB_STEP_SUMMARY" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          result_path, summary_path = map(Path, sys.argv[1:])
          result = json.loads(result_path.read_text(encoding="utf-8"))
          if result.get("status") != "published":
              raise SystemExit(f"runtime publisher did not publish: {result!r}")
          with summary_path.open("a", encoding="utf-8") as summary:
              summary.write(
                  "## Runtime object publication\n\n"
                  + "```json\n"
                  + json.dumps(result, sort_keys=True, separators=(",", ":"))
                  + "\n```\n"
              )
          PY
          cat "$PUBLISH_RESULT"

      - name: Upload runtime publication metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-publication-${{ github.run_id }}
          path: |
            ${{ steps.identity.outputs.runtime_dir }}/manifest.json
            ${{ steps.identity.outputs.runtime_dir }}/READY.json
            ${{ steps.identity.outputs.runtime_dir }}/runtime-summary.json
            ${{ steps.identity.outputs.runtime_dir }}/slim-image.json
            ${{ steps.identity.outputs.runtime_dir }}/runtime-materializer.json
            ${{ steps.identity.outputs.runtime_dir }}/runtime-launcher-smoke.json
            ${{ steps.identity.outputs.runtime_dir }}/runtime-critical-probe.json
            ${{ steps.identity.outputs.runtime_dir }}/runtime-publisher.json
          if-no-files-found: warn
          retention-days: 14

      - name: Delete the runner-local runtime archive
        if: ${{ always() }}
        run: |
          set -euo pipefail
          sudo rm -rf "${{ steps.identity.outputs.runtime_dir }}"
          docker image rm comfy-runtime-exporter:${{ github.sha }} >/dev/null 2>&1 || true
